<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup settings</title>
<style>
  body { margin: 0; padding: 40px 32px; display: grid; place-items: center; background: #f4f4f5; font: 500 13px/1.4 Inter, system-ui, sans-serif; color: #18181b; }
  .card { width: 380px; padding: 8px; background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
  svg { width: 15px; height: 15px; flex: none; }
  .seg { display: flex; background: #f1f1f2; border-radius: 10px; padding: 3px; }
  .seg span { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 26px; padding: 0 10px; white-space: nowrap; border-radius: 7px; color: #71717a; font-size: 12px; }
  .seg span.on { background: #fff; color: #18181b; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .seg svg { width: 13px; height: 13px; }
  .opts { padding: 8px 8px 4px 12px; }
  .opt { display: flex; align-items: center; gap: 9px; height: 34px; white-space: nowrap; }
  .opt > svg { color: #71717a; }
  .val { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12px; background: #dbeafe; color: #1d4ed8; }
  .val svg { width: 13px; height: 13px; }
  .caret { color: #a1a1aa; }
  .toggle { margin-left: auto; width: 30px; height: 18px; border-radius: 99px; background: #2563eb; position: relative; }
  .toggle::after { content: ""; position: absolute; left: 14px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .seg span, .opt, .val { line-height: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="seg"><span><i data-lucide="circle-off"></i>Off</span><span><i data-lucide="shield"></i>Basic</span><span class="on"><i data-lucide="shield-check"></i>Recommended</span><span><i data-lucide="sliders-vertical"></i>Custom</span></div>
    <div class="opts">
      <div class="opt"><i data-lucide="repeat"></i>Back up<span class="val"><i data-lucide="calendar"></i>Every night</span><i class="caret" data-lucide="chevron-right"></i></div>
      <div class="opt"><i data-lucide="archive"></i>Keep copies<span class="val"><i data-lucide="history"></i>30 days</span><i class="caret" data-lucide="chevron-right"></i></div>
      <div class="opt"><i data-lucide="map-pin"></i>Store in<span class="val"><i data-lucide="globe"></i>Same region</span><i class="caret" data-lucide="chevron-right"></i></div>
      <div class="opt"><i data-lucide="lock"></i>Encryption<span class="val"><i data-lucide="key-round"></i>Managed keys</span><i class="caret" data-lucide="chevron-right"></i></div>
      <div class="opt"><i data-lucide="bell"></i>Notify me<span class="val"><i data-lucide="mail"></i>When a backup fails</span><i class="caret" data-lucide="chevron-right"></i></div>
      <div class="opt"><i data-lucide="battery-low"></i>Pause on low battery<span class="toggle"></span></div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
