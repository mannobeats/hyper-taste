<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  /* At its natural width: each task and its date read as one row. */
  .tray { width: min(100%, 520px); background: color-mix(in oklch, var(--fill) 80%, transparent); border-radius: 20px; padding: 4px; box-shadow: inset 0 0 0 1px var(--line); }
  .sheet { padding: 6px 0 8px; border-radius: 16px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 20px 8px; }
  .head h1 { font-size: 17px; letter-spacing: -.01em; }
  .head span { color: var(--muted); font-size: var(--text-sm); }
  .task { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 4px 20px; color: var(--ink); font-weight: var(--w-ui); font-size: var(--text-sm); cursor: pointer; }
  .task:hover { background: var(--panel); }
  .t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
  .due { margin-left: auto; padding-left: 12px; color: var(--muted); font-weight: var(--w-body); white-space: nowrap; }
  .due.soon { color: var(--warn-ink); font-weight: var(--w-ui); }
  .chip svg.lucide { width: 12px; height: 12px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px 8px; color: var(--muted); font-size: var(--text-sm); }
  .foot .kbd { margin-right: 8px; background: var(--surface); box-shadow: var(--shadow-xs); }
  .progress { display: inline-flex; align-items: center; gap: 8px; }
  .progress b { color: var(--ink); font-weight: var(--w-strong); }
  .progress circle { fill: none; stroke-width: 3; }
  @media (max-width: 500px) { .task { min-height: 52px; } .foot > span:first-child { display: none; } }
</style>
</head>
<body>
  <section class="tray">
    <div class="card sheet">
      <header class="head"><h1>This week</h1><span class="num">4 open</span></header>
      <label class="task"><input class="checkbox" type="checkbox"><span class="t">Send <span class="link">March receipts</span> to bookkeeping <span class="chip" style="--h:290"><i data-lucide="credit-card"></i>Finance</span></span><span class="due soon">Today</span></label>
      <label class="task"><input class="checkbox" type="checkbox"><span class="t">Share the Q1 update with advisors <span class="chip" style="--h:150"><i data-lucide="folder"></i>Advisors</span></span><span class="due">Tomorrow</span></label>
      <label class="task"><input class="checkbox" type="checkbox"><span class="t">Book a venue for the spring retreat</span><span class="due">Friday</span></label>
      <label class="task"><input class="checkbox" type="checkbox"><span class="t">File the quarterly VAT return</span><span class="due num">Mar 31</span></label>
    </div>
    <footer class="foot"><span><span class="kbd">/</span>Run a shortcut</span><span class="progress num">March close <b>40%</b><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" stroke="var(--line-strong)"/><circle cx="10" cy="10" r="7.5" stroke="var(--accent)" stroke-linecap="round" stroke-dasharray="18.8 47.1" transform="rotate(-90 10 10)"/></svg></span></footer>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../pair.js"></script>
</body>
</html>
