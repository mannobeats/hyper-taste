<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud spend</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { --accent-h: 250; }
  .report { width: min(100%, 460px); padding: 20px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .head h1 { font-size: var(--text-md); font-weight: var(--w-ui); color: var(--muted); }
  .total { font-size: 34px; font-weight: var(--w-strong); color: var(--ink); letter-spacing: -.03em; line-height: 1.1; margin-top: 2px; }
  .delta { font-size: var(--text-sm); color: var(--muted); margin-top: 4px; }
  .delta b { color: var(--warn-ink); font-weight: var(--w-ui); }
  .key { display: flex; gap: 14px; color: var(--muted); font-size: var(--text-xs); margin: 20px 0 4px; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 10px; height: 4px; border-radius: 2px; }
  .chart { position: relative; display: grid; grid-template-columns: 84px 1fr; row-gap: 16px; padding-top: 14px; }
  .label { font-size: var(--text-sm); color: var(--ink); font-weight: var(--w-ui); align-self: center; }
  .bars { display: grid; gap: 4px; position: relative; z-index: 1; }
  .bars i { display: block; height: 10px; border-radius: 3px; }
  .now { background: var(--chart-1); }
  .avg { background: var(--chart-ref); }
  .over { background: var(--warn); }
  .grid { position: absolute; left: 84px; right: 0; top: 14px; bottom: 22px; display: flex; justify-content: space-between; }
  .grid span { border-left: 1px dashed var(--line); }
  .axis { grid-column: 2; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin: 0 -6px; }
  .tip { position: absolute; z-index: 2; left: 52%; top: 66px; white-space: nowrap; display: grid; gap: 4px; padding: 8px 10px; border-radius: var(--r-md);
         background: var(--strong); color: var(--on-strong); font-size: var(--text-xs); box-shadow: var(--shadow-lg); }
  .tip div { display: flex; align-items: center; gap: 6px; }
  .tip small { opacity: .65; }
  .tip i { width: 8px; height: 8px; border-radius: 2px; }
</style>
</head>
<body>
  <section class="card report">
    <div class="head"><h1>Cloud spend this week</h1><button class="btn sm" type="button">Weekly <i data-lucide="chevron-down"></i></button></div>
    <div class="total num">$18,150</div>
    <p class="delta num"><b>+$3,200</b> over the 12-week average, almost all of it compute</p>
    <div class="key"><span><i class="now"></i>This week</span><span><i class="avg"></i>12-week average</span><span><i class="over"></i>Over average</span></div>
    <div class="chart">
      <div class="grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <span class="label">Compute</span><span class="bars"><i class="over" style="width:93%"></i><i class="avg" style="width:65%"></i></span>
      <span class="label">Storage</span><span class="bars"><i class="now" style="width:36%"></i><i class="avg" style="width:34%"></i></span>
      <span class="label">Bandwidth</span><span class="bars"><i class="now" style="width:22%"></i><i class="avg" style="width:25%"></i></span>
      <div class="axis num"><span>$0</span><span>3K</span><span>6K</span><span>9K</span><span>12K</span></div>
      <div class="tip num">
        <div><i class="now"></i>$4,350 <small>this week</small></div>
        <div><i class="avg"></i>$4,100 <small>average</small></div>
      </div>
    </div>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../pair.js"></script>
</body>
</html>
