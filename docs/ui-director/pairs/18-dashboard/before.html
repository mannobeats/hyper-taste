<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  body { margin: 0; padding: 32px 24px; background: #f8fafc; font: 14px/1.45 Inter, system-ui, sans-serif; color: #0f172a; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .sub { color: #64748b; font-size: 13px; margin: 4px 0 16px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px; box-shadow: 0 4px 12px rgba(15,23,42,.06); }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .lab { font-size: 10px; letter-spacing: .12em; font-weight: 700; color: #64748b; }
  .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
  .ic svg { width: 15px; height: 15px; }
  .v { font-size: 22px; font-weight: 800; margin: 8px 0 6px; }
  .pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: #dcfce7; color: #16a34a; }
  .card a { display: block; margin-top: 10px; font-size: 12px; color: #6366f1; font-weight: 600; text-decoration: none; }
  .pill { line-height: 1; }
</style>
</head>
<body>
  <h1>Welcome back, Sarah! 👋</h1>
  <p class="sub">Here's an overview of how your subscriptions are doing. Keep an eye on the numbers that matter most.</p>
  <div class="cards">
    <div class="card"><div class="top"><span class="lab">MONTHLY REVENUE</span><span class="ic" style="background:#ede9fe;color:#7c3aed"><i data-lucide="dollar-sign"></i></span></div><div class="v">$48,900</div><span class="pill">↑ 9.3%</span><a>View details →</a></div>
    <div class="card"><div class="top"><span class="lab">ACTIVE TRIALS</span><span class="ic" style="background:#dbeafe;color:#2563eb"><i data-lucide="clock"></i></span></div><div class="v">312</div><span class="pill">↑ 2.7%</span><a>View details →</a></div>
    <div class="card"><div class="top"><span class="lab">FAILED PAYMENTS</span><span class="ic" style="background:#fce7f3;color:#db2777"><i data-lucide="triangle-alert"></i></span></div><div class="v">$2,140</div><span class="pill">↑ 6.4%</span><a>View details →</a></div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
