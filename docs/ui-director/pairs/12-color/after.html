<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { --accent-h: 265; }
  .files { width: 360px; padding: 16px; display: grid; gap: 12px; }
  h5 { font-size: var(--text-sm); color: var(--ink); font-weight: var(--w-strong); }
  .storage { display: grid; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .n { font-size: var(--text-xl); font-weight: var(--w-strong); color: var(--ink); }
  .n small { font-size: var(--text-xs); color: var(--muted); font-weight: var(--w-body); }
  .bar { display: flex; gap: 3px; height: 6px; } .bar i { border-radius: 3px; }
  .keys { display: flex; gap: 12px; font-size: var(--text-xs); color: var(--muted); }
  .keys span { display: inline-flex; align-items: center; gap: 5px; }
  .keys .dot { width: 7px; height: 7px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fc { display: grid; gap: 12px; padding: 10px; border-radius: var(--r-md); box-shadow: inset 0 0 0 1px var(--line); font-size: var(--text-xs); color: var(--ink); font-weight: var(--w-ui); }
  .fc small { display: block; color: var(--muted); font-weight: var(--w-body); margin-top: 2px; }
  .ico { width: 26px; height: 26px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--fill); color: var(--muted); }
  .ico svg.lucide { width: 14px; height: 14px; }
</style>
</head>
<body>
  <div class="card files">
    <div class="storage"><h5>Storage</h5><div class="n num">1.7 TB <small>of 2 TB used</small></div>
      <div class="bar"><i style="flex:3;background:var(--chart-1)"></i><i style="flex:2;background:var(--chart-3)"></i><i style="flex:2;background:var(--chart-2)"></i><i style="flex:1;background:var(--fill)"></i></div>
      <div class="keys"><span><i class="dot" style="color:var(--chart-1)"></i>Photos</span><span><i class="dot" style="color:var(--chart-3)"></i>Video</span><span><i class="dot" style="color:var(--chart-2)"></i>Documents</span></div></div>
    <h5>Recently opened</h5>
    <div class="grid">
      <div class="fc"><span class="ico"><i data-lucide="folder"></i></span><div>Wedding, RAW selects<small>8.2 GB · Folder</small></div></div>
      <div class="fc"><span class="ico"><i data-lucide="sheet"></i></span><div>Kitchen quote, final<small>640 KB · Sheet</small></div></div>
      <div class="fc"><span class="ico"><i data-lucide="file"></i></span><div>Tax return 2026<small>1.9 MB · PDF</small></div></div>
      <div class="fc"><span class="ico"><i data-lucide="pen-tool"></i></span><div>Logo explorations<small>96 MB · Figma</small></div></div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../pair.js"></script>
</body>
</html>
