<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { --accent-h: 250; }
  .list { width: min(100%, 560px); padding: 8px 6px 6px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 8px; }
  .head h1 { font-size: 17px; letter-spacing: -.01em; }
  .head span { color: var(--muted); font-size: var(--text-sm); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 12px; font-size: var(--text-sm); color: var(--ink); font-weight: var(--w-ui); }
  .row > svg.lucide { width: 16px; height: 16px; color: var(--muted); }
  .meta { margin-left: auto; color: var(--muted); font-size: var(--text-xs); font-weight: var(--w-body); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .meta .avatar { width: 22px; height: 22px; }
  /* The same list. The one fault: every action on every row, all the time, so four rows carry sixteen buttons. */
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .del { color: var(--bad-ink); }
  @media (max-width: 500px) { .row { flex-wrap: wrap; padding: 8px 14px; } .tools { margin-left: 28px; flex-wrap: wrap; } }
</style>
</head>
<body>
  <section class="card list">
    <header class="head"><h1>Reports</h1><span class="num">4 saved</span></header>
    <div class="row"><i data-lucide="chart-line"></i>Weekly churn<span class="tools"><button class="btn sm" type="button"><i data-lucide="pencil"></i>Edit</button><button class="btn sm" type="button">Duplicate</button><button class="btn sm" type="button">Share</button><button class="btn sm del" type="button">Delete</button></span></div>
    <div class="row"><i data-lucide="chart-line"></i>Spring campaign results<span class="tools"><button class="btn sm" type="button"><i data-lucide="pencil"></i>Edit</button><button class="btn sm" type="button">Duplicate</button><button class="btn sm" type="button">Share</button><button class="btn sm del" type="button">Delete</button></span></div>
    <div class="row"><i data-lucide="chart-line"></i>Support backlog<span class="tools"><button class="btn sm" type="button"><i data-lucide="pencil"></i>Edit</button><button class="btn sm" type="button">Duplicate</button><button class="btn sm" type="button">Share</button><button class="btn sm del" type="button">Delete</button></span></div>
    <div class="row"><i data-lucide="chart-line"></i>Board pack, March<span class="tools"><button class="btn sm" type="button"><i data-lucide="pencil"></i>Edit</button><button class="btn sm" type="button">Duplicate</button><button class="btn sm" type="button">Share</button><button class="btn sm del" type="button">Delete</button></span></div>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../pair.js"></script>
</body>
</html>
