<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { --accent-h: 250; }
  .list { width: min(100%, 560px); padding: 8px 6px 6px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 8px; }
  .head h1 { font-size: 17px; letter-spacing: -.01em; }
  .head span { color: var(--muted); font-size: var(--text-sm); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 12px; font-size: var(--text-sm); color: var(--ink); font-weight: var(--w-ui); }
  .row > svg.lucide { width: 16px; height: 16px; color: var(--muted); }
  .meta { margin-left: auto; color: var(--muted); font-size: var(--text-xs); font-weight: var(--w-body); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .meta .avatar { width: 22px; height: 22px; }
  /* What you do to a row appears on the row you point at; the rest stay calm. */
  .tools { margin-left: auto; display: none; gap: 2px; }
  .row:hover, .row.hover { background: var(--panel); }
  .row:hover .meta, .row.hover .meta { display: none; }
  .row:hover .tools, .row.hover .tools { display: flex; }
  .row.hover .btn.icon:first-child { background: var(--hover); color: var(--ink); }
  .row.hover .btn.icon:first-child::after { opacity: 1; scale: 1; translate: -50% 0; } /* the tooltip, shown open as it would be on hover */
  /* No hover on touch: the row keeps one More button. */
  .more { display: none; }
  @media (max-width: 500px) { .row:hover .tools, .row.hover .tools, .meta .avatar { display: none; } .row.hover .meta, .row:hover .meta { display: flex; } .more { display: inline-flex; margin-left: -4px; } .meta { margin-left: auto; } }
</style>
</head>
<body>
  <section class="card list">
    <header class="head"><h1>Reports</h1><span class="num">4 saved</span></header>
    <div class="row"><i data-lucide="chart-line"></i>Weekly churn<span class="meta"><span class="avatar" style="--h:30">MP</span>Edited 3h ago</span><button class="btn ghost icon sm more" type="button" aria-label="More"><i data-lucide="ellipsis"></i></button></div>
    <div class="row hover"><i data-lucide="chart-line"></i>Spring campaign results<span class="meta">Edited yesterday</span>
      <span class="tools"><button class="btn ghost icon sm" type="button" aria-label="Copy link" data-tip="Copy link"><i data-lucide="link"></i></button><button class="btn ghost icon sm" type="button" aria-label="Duplicate" data-tip="Duplicate"><i data-lucide="copy"></i></button><button class="btn ghost icon sm" type="button" aria-label="More" data-tip="More"><i data-lucide="ellipsis"></i></button></span><button class="btn ghost icon sm more" type="button" aria-label="More"><i data-lucide="ellipsis"></i></button></div>
    <div class="row"><i data-lucide="chart-line"></i>Support backlog<span class="meta"><span class="avatar" style="--h:200">KM</span>Edited Tuesday</span><button class="btn ghost icon sm more" type="button" aria-label="More"><i data-lucide="ellipsis"></i></button></div>
    <div class="row"><i data-lucide="chart-line"></i>Board pack, March<span class="meta num">Edited Oct 6</span><button class="btn ghost icon sm more" type="button" aria-label="More"><i data-lucide="ellipsis"></i></button></div>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../pair.js"></script>
</body>
</html>
