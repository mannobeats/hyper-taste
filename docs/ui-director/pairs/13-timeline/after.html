<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract history</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { --accent-h: 230; }
  .feed { width: min(100%, 460px); padding: 8px 20px 12px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0 4px; }
  .head h1 { font-size: 17px; letter-spacing: -.01em; }
  .head span { color: var(--muted); font-size: var(--text-sm); }
  .day { font-size: var(--text-xs); color: var(--muted); font-weight: var(--w-ui); margin: 14px 0 12px; }
  ol { list-style: none; padding: 0; }
  /* Events in time are a line with marks on it: who did what, when in words, and what happened inline. */
  li { display: grid; grid-template-columns: 24px 1fr auto; column-gap: 12px; padding-bottom: 18px; position: relative; font-size: var(--text-sm); color: var(--ink-2); }
  li::before { content: ""; position: absolute; left: 11.5px; top: 28px; bottom: 4px; width: 1px; background: var(--line); }
  li:last-child { padding-bottom: 4px; } li:last-child::before { display: none; }
  .mk { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--muted); }
  .mk svg.lucide { width: 13px; height: 13px; }
  .mk.ok { background: var(--ok-soft); color: var(--ok-ink); }
  .mk.bad { background: var(--bad-soft); color: var(--bad-ink); }
  .what { align-self: center; } .what b { color: var(--ink); font-weight: var(--w-ui); }
  time { align-self: center; color: var(--muted); font-size: var(--text-xs); white-space: nowrap; }
  .sub { grid-column: 2 / -1; color: var(--muted); font-size: var(--text-xs); margin-top: 4px; }
  blockquote.sub { color: var(--ink-2); font-size: var(--text-sm); padding: 8px 12px; border-radius: 10px; background: var(--panel); margin-top: 8px; }
</style>
</head>
<body>
  <section class="card feed">
    <header class="head"><h1>Supply agreement</h1><span>Signed</span></header>
    <div class="day">This week</div>
    <ol>
      <li><span class="mk ok"><i data-lucide="check"></i></span><span class="what"><b>Ruth</b> signed the contract</span><time class="num">Today, 11:48am</time></li>
      <li><span class="avatar" style="--h:330">DM</span><span class="what"><b>Diego</b> flagged clause 4</span><time>Friday</time><blockquote class="sub">“The renewal notice should be 60 days, not 30.”</blockquote></li>
      <li><span class="avatar" style="--h:210">RA</span><span class="what"><b>Ruth</b> left a comment</span><time>Wednesday</time></li>
    </ol>
    <div class="day">Last week</div>
    <ol>
      <li><span class="mk bad"><i data-lucide="x"></i></span><span class="what"><b>Payment check</b> failed</span><time class="num">Oct 12</time><span class="sub">The card on file expired in September.</span></li>
    </ol>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../pair.js"></script>
</body>
</html>
