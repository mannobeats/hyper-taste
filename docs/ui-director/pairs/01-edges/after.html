<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile card</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { --accent-h: 160; --tint-h: 160; }
  .profile { width: 360px; padding: 6px; }
  .banner { height: 84px; border-radius: 10px;
    background: repeating-radial-gradient(circle at 88% 140%, var(--accent-soft) 0 10px, color-mix(in oklch, var(--accent-soft) 45%, var(--surface)) 10px 20px); }
  .top { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 12px; margin-top: -36px; }
  .ring { padding: 4px; border-radius: 50%; background: var(--surface); }
  .ring .avatar { width: 68px; height: 68px; font-size: 22px; }
  .actions { display: flex; gap: 6px; }
  .body { padding: 12px 16px 0; }
  .name { font-size: var(--text-lg); font-weight: var(--w-strong); color: var(--ink); letter-spacing: -.01em; }
  .bio { color: var(--ink-2); margin-top: 2px; }
  .meta { display: flex; gap: 14px; margin-top: 8px; color: var(--muted); font-size: var(--text-sm); }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .meta svg.lucide { width: 14px; height: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); padding: 16px 16px 14px; }
  .stats dt { color: var(--muted); font-size: var(--text-xs); }
  .stats dd { color: var(--ink); font-size: var(--text-lg); font-weight: var(--w-strong); margin-top: 2px; }
  .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 10px; padding: 12px 0 10px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <article class="card profile">
    <div class="banner"></div>
    <div class="top">
      <div class="ring"><span class="avatar" style="--h:160">TR</span></div>
      <div class="actions">
        <span class="btn icon sm" data-tip="Instagram"><i data-lucide="instagram"></i></span>
        <span class="btn icon sm" data-tip="Copy link"><i data-lucide="link"></i></span>
        <span class="btn icon sm" data-tip="More"><i data-lucide="ellipsis"></i></span>
        <span class="btn sm">Follow</span>
      </div>
    </div>
    <div class="body">
      <div class="name">Tomás Rivera</div>
      <div class="bio">Product designer and founder of Lumen Supply.</div>
      <div class="meta"><span><i data-lucide="map-pin"></i>Lisbon</span><span><i data-lucide="globe"></i>lumen.supply</span></div>
    </div>
    <dl class="stats num">
      <div><dt>Followers</dt><dd>18,402</dd></div>
      <div><dt>Following</dt><dd>1,209</dd></div>
      <div><dt>Posts</dt><dd>86</dd></div>
      <div><dt>Projects</dt><dd>27</dd></div>
    </dl>
    <div class="foot"><span class="btn strong">Hire Tomás</span><span class="btn">Message</span></div>
  </article>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../pair.js"></script>
</body>
</html>
