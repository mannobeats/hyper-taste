<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
  body { margin: 0; padding: 48px 24px 24px; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; text-align: center;
         background: #f0fdf4; font: 14px/1.45 Inter, system-ui, sans-serif; color: #14532d; }
  .skip { align-self: flex-end; font-size: 12px; color: #86efac; }
  .art { width: 240px; height: 240px; margin: 28px auto 24px; border-radius: 50%; display: grid; place-items: center; font-size: 84px;
         background: radial-gradient(circle at 30% 30%, #bbf7d0, #4ade80 60%, #16a34a); box-shadow: 0 20px 60px rgba(22,163,74,.35); }
  h1 { margin: 0 0 10px; font-size: 26px; font-weight: 800; }
  p { margin: 0; font-size: 14px; color: #4d7c0f; }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 22px 0; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #bbf7d0; }
  .dots i:first-child { width: 22px; border-radius: 4px; background: #16a34a; }
  .next { margin-top: auto; padding: 15px; border-radius: 14px; color: #fff; font-weight: 700; background: linear-gradient(90deg, #22c55e, #059669); }
</style>
</head>
<body>
  <span class="skip">Skip</span>
  <div class="art">🌿✨</div>
  <h1>Welcome to Sill! 🌱</h1>
  <p>Your smart, AI-powered plant companion. Track, care for and grow your plants like never before, all in one beautiful app!</p>
  <div class="dots"><i></i><i></i><i></i><i></i></div>
  <div class="next">Next →</div>
</body>
</html>
