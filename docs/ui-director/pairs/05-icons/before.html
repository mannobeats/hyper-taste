<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action bar</title>
<style>
  body { margin: 0; padding: 40px 32px; display: grid; place-items: center; background: #f4f4f5; font: 500 13px/1.4 Inter, system-ui, sans-serif; color: #18181b; }
  .bar { display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 6px; }
  .b { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: #52525b; }
  .b svg { width: 17px; height: 17px; }
  .sep { width: 1px; height: 18px; background: #e4e4e7; margin: 0 4px; }
  .cb { width: 16px; height: 16px; border-radius: 4px; background: #6d28d9; color: #fff; display: grid; place-items: center; }
  .cb svg { width: 11px; height: 11px; stroke-width: 3; }
</style>
</head>
<body>
  <div class="bar">
    <span class="b"><span class="cb"><i data-lucide="check"></i></span></span>
    <span class="sep"></span>
    <span class="b"><i data-lucide="folder-input"></i></span>
    <span class="b"><i data-lucide="bell"></i></span>
    <span class="b"><i data-lucide="pin"></i></span>
    <span class="b"><i data-lucide="tag"></i></span>
    <span class="b"><i data-lucide="star"></i></span>
    <span class="b"><i data-lucide="wand-sparkles"></i></span>
    <span class="b"><i data-lucide="lock"></i></span>
    <span class="b"><i data-lucide="trash-2"></i></span>
  </div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
