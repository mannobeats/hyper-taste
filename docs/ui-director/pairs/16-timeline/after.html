<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .feed { width: 420px; padding: 14px 18px 16px; }
  .day { font-size: var(--text-xs); color: var(--muted); margin: 4px 0 10px; }
  .day:not(:first-child) { margin-top: 6px; }
  ol { list-style: none; padding: 0; }
  li { display: grid; grid-template-columns: 22px 1fr auto; column-gap: 10px; padding-bottom: 16px; position: relative; font-size: var(--text-sm); color: var(--ink); }
  li::before { content: ""; position: absolute; left: 10.5px; top: 24px; bottom: 2px; width: 1px; background: var(--line); }
  li:last-child { padding-bottom: 8px; } li:last-child::before { display: none; }
  .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--muted); }
  .mk svg.lucide { width: 12px; height: 12px; }
  .mk.ok { background: var(--ok-soft); color: var(--ok-ink); }
  .mk.bad { background: var(--bad-soft); color: var(--bad-ink); }
  li .avatar { width: 22px; height: 22px; font-size: 9px; }
  .what { align-self: center; } .what b { font-weight: var(--w-ui); }
  time { align-self: center; color: var(--muted); font-size: var(--text-xs); }
  .sub { grid-column: 2 / -1; color: var(--muted); font-size: var(--text-xs); margin-top: 3px; }
  blockquote.sub { color: var(--ink-2); padding-left: 10px; border-left: 2px solid var(--line); }
</style>
</head>
<body>
  <div class="card feed">
    <div class="day">This week</div>
    <ol>
      <li><span class="mk ok"><i data-lucide="check"></i></span><span class="what"><b>Ruth</b> signed the contract</span><time class="num">Today, 11:48am</time></li>
      <li><span class="avatar" style="--h:330">DM</span><span class="what"><b>Diego</b> flagged clause 4</span><time>Friday</time><blockquote class="sub">"The renewal notice should be 60 days, not 30."</blockquote></li>
      <li><span class="avatar" style="--h:210">RA</span><span class="what"><b>Ruth</b> left a comment</span><time>Wednesday</time></li>
    </ol>
    <div class="day">Last week</div>
    <ol>
      <li><span class="mk bad"><i data-lucide="x"></i></span><span class="what">Payment check failed</span><time class="num">Oct 12</time><span class="sub">The card on file expired in September</span></li>
    </ol>
  </div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../pair.js"></script>
</body>
</html>
