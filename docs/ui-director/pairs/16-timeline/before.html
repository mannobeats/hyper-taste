<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract history</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  /* The same card and the same events. The one fault: a timeline poured into a table, with machine dates and a column for who. */
  :root { --accent-h: 230; }
  .feed { width: min(100%, 460px); padding: 8px 0 4px; overflow: hidden; }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 20px 10px; }
  .head h1 { font-size: 17px; letter-spacing: -.01em; }
  .head span { color: var(--muted); font-size: var(--text-sm); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  th { text-align: left; font-weight: var(--w-ui); color: var(--muted); font-size: var(--text-xs); padding: 0 12px 10px; white-space: nowrap; }
  td { padding: 0 12px; height: 44px; border-top: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  th:first-child, td:first-child { padding-left: 20px; }
</style>
</head>
<body>
  <section class="card feed">
    <header class="head"><h1>Supply agreement</h1><span>Signed</span></header>
    <div class="scroll"><table>
      <thead><tr><th>Date</th><th>Event</th><th>User</th></tr></thead>
      <tbody class="num">
        <tr><td>2026-10-19 11:48</td><td>Contract signed</td><td>Ruth Adeyemi</td></tr>
        <tr><td>2026-10-17 15:02</td><td>Clause flagged</td><td>Diego Marín</td></tr>
        <tr><td>2026-10-15 10:37</td><td>Comment added</td><td>Ruth Adeyemi</td></tr>
        <tr><td>2026-10-12 08:15</td><td>Payment check failed</td><td>System</td></tr>
        <tr><td>2026-10-12 08:14</td><td>Payment check started</td><td>System</td></tr>
      </tbody>
    </table></div>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../pair.js"></script>
</body>
</html>
