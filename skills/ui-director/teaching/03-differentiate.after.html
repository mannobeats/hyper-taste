<!doctype html>
<html lang="en">
<head>
<!-- Teaching pair, the right half: Grouped by day, with faces for people, chips for categories and the link color for links. You find any task in a second. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="stylesheet" href="tokens.css">
<script>
  // ?theme=dark or ?theme=light picks a mode; otherwise the system's.
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || (!t && !document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
</script>
<style>
  .sheet { width: min(100%, 480px); padding: 8px 0 12px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 20px 4px; }
  .head h1 { font-size: 17px; letter-spacing: -.01em; }
  .head span { color: var(--muted); font-size: var(--text-sm); }
  .group { font-size: var(--text-xs); color: var(--muted); font-weight: var(--w-ui); padding: 14px 20px 4px; }
  .task { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 4px 20px; color: var(--ink); font-weight: var(--w-ui); font-size: var(--text-sm); cursor: pointer; }
  .task:hover { background: var(--panel); }
  .t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
  .end { margin-left: auto; padding-left: 12px; color: var(--muted); font-weight: var(--w-body); white-space: nowrap; }
  .end.soon { color: var(--warn-ink); font-weight: var(--w-ui); }
  .chip svg.lucide { width: 12px; height: 12px; }
  .person { display: inline-flex; align-items: center; gap: 6px; }
  .person .avatar { width: 22px; height: 22px; }
  @media (max-width: 500px) { .task { min-height: 52px; } }
</style>
</head>
<body>
  <section class="card sheet">
    <header class="head"><h1>My tasks</h1><span class="num">6 open</span></header>
    <div class="group">Tomorrow</div>
    <label class="task"><input class="checkbox" type="checkbox"><span class="t">Confirm the caterer for the retreat</span><span class="end soon num">10am</span></label>
    <label class="task"><input class="checkbox" type="checkbox"><span class="t">Hand <span class="link">March receipts</span> to <span class="person"><span class="avatar" style="--h:200">O</span>Omar</span><span class="chip" style="--h:290"><i data-lucide="credit-card"></i>Finance</span></span><span class="end num">2pm</span></label>
    <div class="group">Next week</div>
    <label class="task"><input class="checkbox" type="checkbox"><span class="t">File the <span class="link">VAT return</span> for both entities</span><span class="end">Mon</span></label>
    <label class="task"><input class="checkbox" type="checkbox"><span class="t">Roadmap review with <span class="person"><span class="avatar" style="--h:60">L</span>Lena</span></span><span class="end">Wed</span></label>
    <label class="task"><input class="checkbox" type="checkbox"><span class="t">Q1 update to advisors <span class="chip" style="--h:150"><i data-lucide="folder"></i>Advisors</span></span><span class="end">Thu</span></label>
    <label class="task"><input class="checkbox" type="checkbox"><span class="t">New-hire details to People ops <span class="chip" style="--h:340"><i data-lucide="receipt"></i>Payroll</span></span><span class="end">Fri</span></label>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
</script>
</body>
</html>
