<!doctype html>
<html lang="en">
<head>
<!-- Teaching pair, the right half: The defaults are plain text, so the one setting someone changed is the first thing you see. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backups</title>
<link rel="stylesheet" href="tokens.css">
<script>
  // ?theme=dark or ?theme=light picks a mode; otherwise the system's.
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || (!t && !document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
</script>
<style>
  :root { --accent-h: 250; }
  .settings { width: min(100%, 420px); padding: 20px 8px 8px; }
  .head { padding: 0 12px 16px; }
  .head h1 { font-size: 17px; letter-spacing: -.01em; }
  .head p { color: var(--muted); font-size: var(--text-sm); margin-top: 2px; }
  .seg { display: flex; margin: 0 12px; background: var(--fill); border-radius: 10px; padding: 3px; }
  .seg span { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; height: 28px; padding: 0 8px; white-space: nowrap; border-radius: 7px; color: var(--muted); font-size: var(--text-xs); font-weight: var(--w-ui); line-height: 1; }
  .seg span.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }
  .opts { margin-top: 10px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; white-space: nowrap; color: var(--ink); font-size: var(--text-sm); font-weight: var(--w-ui); text-align: left; }
  .opt:hover { background: var(--panel); }
  .opt > svg.lucide { width: 16px; height: 16px; color: var(--muted); }
  .val { margin-left: auto; color: var(--muted); font-weight: var(--w-body); }
  .opt .chip { margin-left: auto; }
  .opt .caret { width: 14px; height: 14px; color: var(--faint); margin-left: -4px; }
  .toggle { margin-left: auto; width: 34px; height: 20px; border-radius: var(--r-full); background: var(--line-strong); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px oklch(0 0 0 / .2); }
</style>
</head>
<body>
  <section class="card settings">
    <header class="head"><h1>Backups</h1><p class="num">Last backup tonight at 2:14am · 38 GB</p></header>
    <div class="seg" role="radiogroup" aria-label="Protection"><span>Off</span><span>Basic</span><span class="on">Recommended</span><span>Custom</span></div>
    <div class="opts">
      <button class="opt" type="button"><i data-lucide="repeat"></i>Back up<span class="val">Every night</span><i class="caret" data-lucide="chevron-right"></i></button>
      <button class="opt" type="button"><i data-lucide="archive"></i>Keep copies<span class="val">30 days</span><i class="caret" data-lucide="chevron-right"></i></button>
      <button class="opt" type="button"><i data-lucide="map-pin"></i>Store in<span class="chip accent">Frankfurt</span><i class="caret" data-lucide="chevron-right"></i></button>
      <button class="opt" type="button"><i data-lucide="lock"></i>Encryption<span class="val">Managed keys</span><i class="caret" data-lucide="chevron-right"></i></button>
      <button class="opt" type="button"><i data-lucide="bell"></i>Notify me<span class="val">When a backup fails</span><i class="caret" data-lucide="chevron-right"></i></button>
      <button class="opt" type="button" role="switch" aria-checked="false"><i data-lucide="battery-low"></i>Pause on low battery<span class="toggle"></span></button>
    </div>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
</script>
</body>
</html>
