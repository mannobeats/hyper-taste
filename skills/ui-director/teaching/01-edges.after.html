<!doctype html>
<html lang="en">
<head>
<!-- Teaching pair, the right half: The avatar and the actions share one line under the cover, and the name, the stats and the buttons all start on the same edge. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile card</title>
<link rel="stylesheet" href="tokens.css">
<script>
  // ?theme=dark or ?theme=light picks a mode; otherwise the system's.
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || (!t && !document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
</script>
<style>
  :root { --accent-h: 60; --tint-h: 60; }
  .profile { width: min(100%, 400px); }
  /* The cover is drawn from his world: a pendant lamp over a halftone of its own light. */
  .cover { display: block; height: 116px; margin: 6px 6px 0; border-radius: 12px; overflow: hidden; width: calc(100% - 12px); max-width: none; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 20px; margin-top: -40px; position: relative; }
  .ring { padding: 4px; border-radius: 50%; background: var(--surface); }
  .ring .avatar { width: 76px; height: 76px; font-size: 26px; letter-spacing: -.03em; }
  .actions { display: flex; gap: 8px; }
  .who { padding: 14px 20px 0; }
  .name { font-size: 19px; letter-spacing: -.015em; }
  .bio { color: var(--ink-2); margin-top: 4px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; color: var(--muted); font-size: var(--text-sm); }
  .meta > * { display: inline-flex; align-items: center; gap: 5px; }
  .meta svg.lucide { width: 14px; height: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 18px 20px 0; padding: 16px 0; border-top: 1px solid var(--line); }
  .stats dt { color: var(--muted); font-size: var(--text-xs); }
  .stats dd { color: var(--ink); font-size: 18px; font-weight: var(--w-strong); letter-spacing: -.01em; margin-top: 2px; }
  @media (max-width: 500px) { .meta a { min-height: var(--touch); margin: -12px 0; } }
  .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 20px 20px; }
</style>
</head>
<body>
  <article class="card profile">
    <svg class="cover" viewBox="0 0 388 116" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(.27 .03 60)"/><stop offset="1" stop-color="oklch(.19 .02 60)"/></linearGradient>
        <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.05" fill="oklch(.9 .1 80)"/></pattern>
        <radialGradient id="glow" cx="296" cy="44" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <mask id="m"><rect width="388" height="116" fill="url(#glow)"/></mask>
        <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(.92 .1 80)" stop-opacity=".34"/><stop offset="1" stop-color="oklch(.92 .1 80)" stop-opacity="0"/></linearGradient>
      </defs>
      <rect width="388" height="116" fill="url(#g)"/>
      <rect width="388" height="116" fill="url(#dots)" mask="url(#m)" opacity=".75"/>
      <polygon points="284,45 308,45 368,116 224,116" fill="url(#cone)"/>
      <line x1="296" y1="0" x2="296" y2="30" stroke="oklch(.62 .02 60)" stroke-width="1"/>
      <path d="M279 45 C281 33 288 29 296 29 C304 29 311 33 313 45 Z" fill="oklch(.74 .05 70)"/>
      <ellipse cx="296" cy="45.5" rx="9" ry="2.4" fill="oklch(.98 .05 90)"/>
    </svg>
    <div class="top">
      <span class="ring"><span class="avatar" style="--h:60">TR</span></span>
      <div class="actions">
        <button class="btn" type="button">Follow</button>
        <button class="btn icon" type="button" aria-label="More" data-tip="More"><i data-lucide="ellipsis"></i></button>
      </div>
    </div>
    <div class="who">
      <h1 class="name">Tomás Rivera</h1>
      <p class="bio">Product designer and founder of Lumen Supply.</p>
      <p class="meta"><span><i data-lucide="map-pin"></i>Lisbon</span><a class="link" href="#">lumen.supply</a></p>
    </div>
    <dl class="stats num">
      <div><dt>Followers</dt><dd>18,402</dd></div>
      <div><dt>Following</dt><dd>1,209</dd></div>
      <div><dt>Posts</dt><dd>86</dd></div>
      <div><dt>Projects</dt><dd>27</dd></div>
    </dl>
    <div class="foot"><button class="btn strong lg" type="button">Hire Tomás</button><button class="btn lg" type="button">Message</button></div>
  </article>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
</script>
</body>
</html>
