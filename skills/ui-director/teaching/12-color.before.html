<!doctype html>
<html lang="en">
<head>
<!-- Teaching pair, the wrong half: Color everywhere: a gradient card and a rainbow of tiles, so the storage bar, the only data, looks like decoration. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<link rel="stylesheet" href="tokens.css">
<script>
  // ?theme=dark or ?theme=light picks a mode; otherwise the system's.
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || (!t && !document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
</script>
<style>
  :root { --accent-h: 265; }
  .files { width: min(100%, 440px); padding: 20px; display: grid; gap: 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  h1, h2 { font-size: var(--text-sm); color: var(--ink); font-weight: var(--w-strong); }
  .storage { display: grid; gap: 10px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .n { font-size: 28px; font-weight: var(--w-strong); color: var(--ink); letter-spacing: -.03em; line-height: 1.1; }
  .n small { font-size: var(--text-sm); color: var(--muted); font-weight: var(--w-body); letter-spacing: 0; }
  /* Color is spent on the one thing that is data. */
  .bar { display: flex; gap: 3px; height: 8px; } .bar i { border-radius: 3px; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--text-xs); color: var(--muted); }
  .keys span { display: inline-flex; align-items: center; gap: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fc { display: grid; gap: 10px; padding: 6px 6px 10px; border-radius: 14px; text-decoration: none; color: var(--ink); font-size: var(--text-sm); font-weight: var(--w-ui); }
  .fc:hover { background: var(--panel); }
  .fc small { display: block; color: var(--muted); font-size: var(--text-xs); font-weight: var(--w-body); margin-top: 2px; }
  .meta { padding: 0 4px; }
  /* Each file shows itself, drawn in the neutrals. */
  .pv { height: 96px; border-radius: 10px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; position: relative; }
  .pv svg { width: 100%; height: 100%; }
  .ink { stroke: var(--line-strong); fill: none; }
  .paper { fill: var(--surface); }
  .mark { fill: var(--line-strong); }
  .mark-2 { fill: var(--faint); }
  .print { fill: var(--surface); stroke: var(--line); }
  /* The same files. The one fault: color everywhere, so the bar that is data looks like decoration. */
  .files { background: linear-gradient(160deg, #ffe39a, #ffb86b); }
  .storage { background: #fffbe9; border: 0; border-radius: 14px; padding: 14px; }
  .bar i:nth-child(1) { background: #8b5cf6 !important; } .bar i:nth-child(2) { background: #ec4899 !important; } .bar i:nth-child(3) { background: #84cc16 !important; } .bar i:nth-child(4) { background: #1f2937 !important; }
  .keys span:nth-child(1) .dot { color: #8b5cf6 !important; } .keys span:nth-child(2) .dot { color: #ec4899 !important; } .keys span:nth-child(3) .dot { color: #84cc16 !important; }
  h2 { color: #3a2a00; }
  .fc { color: #fff; } .fc small { color: #fff; opacity: .85; }
  .fc:nth-child(1) { background: #0ea5e9; } .fc:nth-child(2) { background: #16a34a; } .fc:nth-child(3) { background: #dc2626; } .fc:nth-child(4) { background: #ea580c; }
  .pv { background: oklch(1 0 0 / .22); box-shadow: none; }
  .fc:nth-child(1) .mark, .fc:nth-child(1) .mark-2 { fill: #f472b6; } .fc:nth-child(2) .ink { stroke: #a3e635; } .fc:nth-child(3) .mark { fill: #facc15; } .fc:nth-child(4) .ink { stroke: #a78bfa; }
</style>
</head>
<body>
  <section class="card files">
    <div class="storage">
      <div class="top"><h1>Storage</h1><button class="btn sm" type="button">Manage</button></div>
      <div class="n num">1.7 TB <small>of 2 TB used</small></div>
      <div class="bar" role="img" aria-label="Photos 0.8 TB, video 0.5 TB, documents 0.4 TB, 0.3 TB free"><i style="flex:8;background:var(--chart-1)"></i><i style="flex:5;background:var(--chart-3)"></i><i style="flex:4;background:var(--chart-2)"></i><i style="flex:3;background:var(--fill)"></i></div>
      <div class="keys num"><span><i class="dot" style="color:var(--chart-1)"></i>Photos 0.8 TB</span><span><i class="dot" style="color:var(--chart-3)"></i>Video 0.5 TB</span><span><i class="dot" style="color:var(--chart-2)"></i>Documents 0.4 TB</span></div>
    </div>
    <h2>Recently opened</h2>
    <div class="grid">
      <a class="fc" href="#">
        <div class="pv" aria-hidden="true"><svg viewBox="0 0 180 96" preserveAspectRatio="xMidYMid slice">
          <g transform="rotate(-7 70 52)"><rect class="print" x="40" y="22" width="60" height="48" rx="3"/><rect class="mark" x="45" y="27" width="50" height="34" rx="1.5" opacity=".5"/></g>
          <g transform="rotate(6 110 50)"><rect class="print" x="82" y="20" width="60" height="48" rx="3"/><rect class="mark" x="87" y="25" width="50" height="34" rx="1.5" opacity=".7"/></g>
          <g><rect class="print" x="60" y="30" width="62" height="50" rx="3"/><rect class="mark-2" x="65" y="35" width="52" height="35" rx="1.5" opacity=".55"/><circle class="paper" cx="104" cy="44" r="4" opacity=".9"/><path class="paper" d="M65 70 L82 54 L94 64 L102 57 L117 70 Z" opacity=".9"/></g>
        </svg></div>
        <div class="meta">Wedding, RAW selects<small class="num">8.2 GB · Folder</small></div>
      </a>
      <a class="fc" href="#">
        <div class="pv" aria-hidden="true"><svg viewBox="0 0 180 96" preserveAspectRatio="xMidYMid slice">
          <rect class="paper" x="22" y="16" width="136" height="80" rx="3"/>
          <rect class="mark" x="22" y="16" width="136" height="12" opacity=".45"/>
          <path class="ink" d="M22 28h136M22 40h136M22 52h136M22 64h136M22 76h136M60 16v80M94 16v80M126 16v80"/>
          <rect class="mark-2" x="126" y="64" width="32" height="12" opacity=".5"/>
        </svg></div>
        <div class="meta">Kitchen quote, final<small class="num">640 KB · Sheet</small></div>
      </a>
      <a class="fc" href="#">
        <div class="pv" aria-hidden="true"><svg viewBox="0 0 180 96" preserveAspectRatio="xMidYMid slice">
          <rect class="paper" x="54" y="14" width="72" height="94" rx="3"/>
          <rect class="mark-2" x="64" y="24" width="34" height="5" rx="2"/>
          <rect class="mark" x="64" y="36" width="52" height="3" rx="1.5"/><rect class="mark" x="64" y="43" width="48" height="3" rx="1.5"/><rect class="mark" x="64" y="50" width="52" height="3" rx="1.5"/>
          <rect class="mark" x="64" y="62" width="24" height="3" rx="1.5"/><rect class="mark" x="98" y="62" width="18" height="3" rx="1.5"/>
          <rect class="mark" x="64" y="69" width="24" height="3" rx="1.5"/><rect class="mark" x="98" y="69" width="18" height="3" rx="1.5"/>
          <rect class="mark-2" x="64" y="79" width="52" height="1"/>
        </svg></div>
        <div class="meta">Tax return 2026<small class="num">1.9 MB · PDF</small></div>
      </a>
      <a class="fc" href="#">
        <div class="pv" aria-hidden="true"><svg viewBox="0 0 180 96" preserveAspectRatio="xMidYMid slice">
          <circle class="ink" cx="68" cy="48" r="20" stroke-width="1.5"/>
          <rect class="ink" x="98" y="30" width="36" height="36" rx="9" stroke-width="1.5"/>
          <path class="ink" d="M40 80 C70 60 110 92 146 72" stroke-width="1.5"/>
          <rect x="94" y="26" width="44" height="44" fill="none" stroke="var(--muted)" stroke-width="1"/>
          <rect class="paper" x="91.5" y="23.5" width="5" height="5" stroke="var(--muted)"/><rect class="paper" x="135.5" y="23.5" width="5" height="5" stroke="var(--muted)"/>
          <rect class="paper" x="91.5" y="67.5" width="5" height="5" stroke="var(--muted)"/><rect class="paper" x="135.5" y="67.5" width="5" height="5" stroke="var(--muted)"/>
        </svg></div>
        <div class="meta">Logo explorations<small class="num">96 MB · Design</small></div>
      </a>
    </div>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
</script>
</body>
</html>
