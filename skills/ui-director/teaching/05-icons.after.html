<!doctype html>
<html lang="en">
<head>
<!-- Teaching pair, the right half: A count, three labeled actions, and icons only where everyone knows them: delete and more. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices</title>
<link rel="stylesheet" href="tokens.css">
<script>
  // ?theme=dark or ?theme=light picks a mode; otherwise the system's.
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || (!t && !document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
</script>
<style>
  :root { --accent-h: 250; }
  .list { width: min(100%, 560px); padding: 8px 0 0; overflow: hidden; }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 20px 8px; }
  .head h1 { font-size: 17px; letter-spacing: -.01em; }
  .head span { color: var(--muted); font-size: var(--text-sm); }
  .row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px; min-height: 44px; padding: 0 20px; border-top: 1px solid var(--line); font-size: var(--text-sm); color: var(--ink); cursor: pointer; }
  .row.on { background: var(--accent-soft); border-top-color: color-mix(in oklch, var(--accent) 14%, var(--line)); }
  .who b { font-weight: var(--w-ui); }
  .who small { color: var(--muted); font-size: var(--text-xs); margin-left: 8px; }
  .row.on .who small, .row.on .date { color: var(--ink-2); }
  .amt { font-weight: var(--w-ui); text-align: right; }
  .date { color: var(--muted); width: 52px; text-align: right; }
  /* The bar for the selection: a count, three labeled actions, and icons only for the two everyone knows. */
  .dock { display: grid; place-items: center; padding: 16px 12px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  .bar { display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 14px; background: var(--strong); color: var(--on-strong); box-shadow: var(--shadow-lg); }
  .count { display: inline-flex; align-items: center; padding: 0 12px 0 10px; font-size: var(--text-sm); font-weight: var(--w-ui); white-space: nowrap; }
  .sep { width: 1px; height: 18px; background: color-mix(in oklch, var(--on-strong) 20%, transparent); margin: 0 4px; }
  .bar .btn { color: var(--on-strong); background: none; box-shadow: none; border-radius: 9px; }
  .bar .btn:hover { background: color-mix(in oklch, var(--on-strong) 12%, transparent); }
  .bar .btn.icon { color: color-mix(in oklch, var(--on-strong) 72%, transparent); }
  @media (max-width: 500px) { .who small, .date, .wide { display: none; } .row { grid-template-columns: auto 1fr auto; } }
</style>
</head>
<body>
  <section class="card list">
    <header class="head"><h1>Invoices</h1><span class="num">October</span></header>
    <label class="row on"><input class="checkbox" type="checkbox" checked><span class="who"><b>Corner Grocer</b><small>INV-2142</small></span><span class="amt num">$486.00</span><span class="date num">Oct 7</span></label>
    <label class="row on"><input class="checkbox" type="checkbox" checked><span class="who"><b>Elm Street Café</b><small>INV-2141</small></span><span class="amt num">$212.50</span><span class="date num">Oct 15</span></label>
    <label class="row"><input class="checkbox" type="checkbox"><span class="who"><b>Bluebird Deli</b><small>INV-2144</small></span><span class="amt num">$740.00</span><span class="date num">Oct 23</span></label>
    <label class="row on"><input class="checkbox" type="checkbox" checked><span class="who"><b>Harbor Hotel</b><small>INV-2145</small></span><span class="amt num">$1,180.00</span><span class="date num">Oct 24</span></label>
    <label class="row on"><input class="checkbox" type="checkbox" checked><span class="who"><b>Ridge School</b><small>INV-2140</small></span><span class="amt num">$328.00</span><span class="date num">Oct 28</span></label>
    <div class="dock">
      <div class="bar" role="toolbar" aria-label="4 invoices selected">
        <span class="count num">4 selected</span>
        <span class="sep"></span>
        <button class="btn sm" type="button"><i data-lucide="folder-input"></i>Move</button>
        <button class="btn sm wide" type="button"><i data-lucide="bell"></i>Remind</button>
        <button class="btn sm" type="button"><i data-lucide="tag"></i>Label</button>
        <span class="sep"></span>
        <button class="btn icon sm" type="button" aria-label="Delete" data-tip="Delete"><i data-lucide="trash-2"></i></button>
        <button class="btn icon sm" type="button" aria-label="More" data-tip="More"><i data-lucide="ellipsis"></i></button>
      </div>
    </div>
  </section>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
</script>
</body>
</html>
