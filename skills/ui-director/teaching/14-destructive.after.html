<!doctype html>
<html lang="en">
<head>
<!-- Teaching pair, the right half: The title names the workspace, the dialog counts what goes with it, and the red button says what it does. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove workspace</title>
<link rel="stylesheet" href="tokens.css">
<script>
  // ?theme=dark or ?theme=light picks a mode; otherwise the system's.
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || (!t && !document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
</script>
<style>
  :root { --accent-h: 290; }
  body { position: relative; overflow: hidden; }
  /* The page the dialog came from, dimmed behind it. */
  .page { position: absolute; inset: 0; padding: clamp(24px, 5vw, 56px) clamp(16px, 6vw, 72px); display: grid; align-content: start; gap: 18px; }
  .page h2 { font-size: 22px; letter-spacing: -.02em; }
  .page .rows { width: min(100%, 640px); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-sm); }
  .page .row { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 20px; font-size: var(--text-sm); color: var(--ink); }
  .page .row + .row { border-top: 1px solid var(--line); }
  .page .row span:last-child { color: var(--muted); }
  .scrim { position: absolute; inset: 0; background: color-mix(in oklch, var(--shade) 34%, transparent); backdrop-filter: blur(3px); }
  /* The dialog names the thing, says what goes with it, and the red button says what it does. */
  .dialog { position: relative; width: min(100%, 400px); padding: 22px; border-radius: 18px; background: var(--surface); box-shadow: var(--hi), var(--shadow-lg); }
  .dialog h1 { font-size: 18px; letter-spacing: -.015em; }
  .dialog p { margin-top: 8px; color: var(--ink-2); font-size: var(--text-sm); }
  .loss { margin-top: 14px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .loss div { display: flex; justify-content: space-between; min-height: 36px; align-items: center; padding: 0 14px; font-size: var(--text-sm); color: var(--ink-2); }
  .loss div + div { border-top: 1px solid var(--line); }
  .loss b { color: var(--ink); font-weight: var(--w-ui); }
  .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  @media (max-width: 500px) { .acts { flex-direction: column-reverse; } .acts .btn { width: 100%; } }
</style>
</head>
<body>
  <div class="page" inert>
    <h2>Workspace settings</h2>
    <div class="rows">
      <div class="row"><span>Name</span><span>Northshore</span></div>
      <div class="row"><span>Members</span><span class="num">4</span></div>
      <div class="row"><span>Plan</span><span>Team, billed yearly</span></div>
      <div class="row"><span>Danger zone</span><span>Remove workspace</span></div>
    </div>
  </div>
  <div class="scrim"></div>
  <div class="dialog" role="alertdialog" aria-labelledby="t" aria-describedby="d">
    <h1 id="t">Remove “Northshore”?</h1>
    <p id="d">Everything in it is deleted for everyone. This can’t be undone.</p>
    <div class="loss num">
      <div><span>Projects</span><b>9</b></div>
      <div><span>Files</span><b>212</b></div>
      <div><span>Members who lose access</span><b>4</b></div>
    </div>
    <div class="acts"><button class="btn lg" type="button">Keep workspace</button><button class="btn danger lg" type="button">Remove workspace</button></div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
</script>
</body>
</html>
